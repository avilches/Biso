site_name: biso
site_description: Especificacion y decisiones de diseno de biso, el CLI de gestion de tareas
docs_dir: ../..
site_dir: ../../../site

# docs/superpowers/ guarda los documentos de diseno y los planes de las sesiones de
# brainstorming. Se publican, porque ESTADO-DEL-ARTE.md enlaza a uno de ellos, pero no
# entran en el menu lateral para no mezclarlos con los documentos principales.
not_in_nav: |
  superpowers/

# docs-tooling/ guarda los scripts, los fixtures del tutorial y la configuracion de MkDocs:
# nada de eso es contenido a publicar.
exclude_docs: |
  docs-tooling/

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - content.code.copy
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: es

# Un enlace a un fichero que no existe, a un ancla que no existe, o escrito de una forma que
# MkDocs no reconoce pasa a ser un aviso, y con --strict, un fallo de build. Es lo que sostiene
# la convencion de citar por el titulo de la seccion en vez de por su numero: una referencia
# rota deja de ser un error silencioso. Los enlaces absolutos se rechazan de plano, porque la
# convencion del proyecto es citar siempre con rutas relativas.
#
# Lo que esto NO cubre: los ficheros Markdown de fuera de docs/, como CLAUDE.md y los de
# bench/. MkDocs solo ve lo que hay dentro de docs_dir, y de esos se encarga
# tools/comprobar_enlaces.py.
validation:
  anchors: warn
  unrecognized_links: warn
  absolute_links: warn
  omitted_files: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Sin esto, el titulo "Codigos de salida" genera el ancla "codigos-de-salida", sin los
      # acentos, y un enlace que los lleve falla. Con el slugify de pymdownx las anclas
      # conservan los acentos, quedan legibles y coinciden con las que genera GitHub, asi que
      # un enlace funciona igual en el sitio y leyendo el fichero en crudo.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Tutorial: TUTORIAL.md
  - Especificacion:
    - "biso: especificacion del CLI de gestion de tareas": spec/index.md
    - Vocabulario de esta especificacion: spec/vocabulario.md
    - Los principios: spec/principios.md
    - Codigos de salida: spec/codigos-de-salida.md
    - Banderas globales, entorno y configuracion de maquina: spec/invocacion.md
    - Como se elige el tablero: spec/resolucion-del-tablero.md
    - Terminal, flujos de salida y codificacion: spec/salida-y-terminal.md
    - Como se pasa un valor: spec/valores-de-entrada.md
    - Orden de escritura, concurrencia y datos danados: spec/garantias.md
    - El modelo de datos de una tarea: spec/modelo-de-datos.md
    - Los presupuestos de arranque y de tamano: spec/presupuestos.md
    - Los vocabularios del tablero y la regla de validacion: spec/vocabularios.md
    - Como se resuelve una referencia a una tarea: spec/referencias.md
    - Las familias de banderas: spec/familias-de-banderas.md
    - Comandos:
      - Los comandos: spec/cmd/index.md
      - biso prime, el arranque de una sesion: spec/cmd/prime.md
      - biso init: spec/cmd/init.md
      - biso where: spec/cmd/where.md
      - biso new: spec/cmd/new.md
      - biso ls: spec/cmd/ls.md
      - biso get: spec/cmd/get.md
      - biso set: spec/cmd/set.md
      - "Los verbos del ciclo: start, note, comment, finish, ask, answer": spec/cmd/verbos-del-ciclo.md
      - biso archive: spec/cmd/archive.md
      - biso export: spec/cmd/export.md
      - biso config: spec/cmd/config.md
      - biso doctor: spec/cmd/doctor.md
      - biso board: spec/cmd/board.md
      - "La ayuda: biso help y biso --help": spec/cmd/help.md
      - biso snapshot: spec/cmd/snapshot.md
    - El contrato JSON: spec/contrato-json.md
    - El contrato de estabilidad: spec/estabilidad.md
    - Lo que se deja fuera a proposito: spec/fuera-de-alcance.md
    - Por donde empezar a implementar: spec/por-donde-empezar.md
  - Decisiones de diseno: DECISIONES.md
  - Estado del arte: ESTADO-DEL-ARTE.md
  - Pendientes: PENDIENTES.md
