site_name: biso
site_description: Especificacion y decisiones de diseno de biso, el CLI de gestion de tareas
docs_dir: ../..
site_dir: ../../../site

# docs-tooling/ guarda los scripts, los fixtures del tutorial y la configuracion de MkDocs, y
# docs/superpowers/ las actas y planes de las sesiones de diseno internas: nada de eso es
# contenido a publicar, aunque los dos vivan versionados dentro de docs/.
exclude_docs: |
  docs-tooling/
  superpowers/

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: es
  - git-revision-date-localized:
      type: date
      locale: es
      fallback_to_build_date: true

hooks:
  - notas_lectura.py

# Un enlace a un fichero que no existe, a un ancla que no existe, o escrito de una forma que
# MkDocs no reconoce pasa a ser un aviso, y con --strict, un fallo de build. Es lo que sostiene
# la convencion de citar por el titulo de la seccion en vez de por su numero: una referencia
# rota deja de ser un error silencioso. Los enlaces absolutos se rechazan de plano, porque la
# convencion del proyecto es citar siempre con rutas relativas.
#
# Lo que esto NO cubre: los ficheros Markdown de fuera de docs/, como CLAUDE.md y los de
# bench/. MkDocs solo ve lo que hay dentro de docs_dir, y de esos se encarga
# docs/docs-tooling/tools/comprobar_enlaces.py.
validation:
  anchors: warn
  unrecognized_links: warn
  absolute_links: warn
  omitted_files: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Sin esto, el titulo "Codigos de salida" genera el ancla "codigos-de-salida", sin los
      # acentos, y un enlace que los lleve falla. Con el slugify de pymdownx las anclas
      # conservan los acentos, quedan legibles y coinciden con las que genera GitHub, asi que
      # un enlace funciona igual en el sitio y leyendo el fichero en crudo.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
