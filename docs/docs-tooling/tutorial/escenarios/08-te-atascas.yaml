id: 08-te-atascas
title: You get stuck and someone has to decide
situation: |
  You're still on `TASK-19`, and you reach a point where you can't go on without someone deciding
  something: how many retries at most should be allowed before treating the 5xx as a definitive
  failure. You could just make up a number, but that's exactly what rule 10 of `biso`'s startup
  message asks you not to do: "Ask instead of guessing." Before parking your question, take a
  look at what one looks like from the outside: `TASK-60` already has one open, and this is how it
  shows up in the `NEEDS ANSWER` block of the startup message, exactly as `biso prime` prints it:

  ```
  NEEDS ANSWER
    TASK-60  In Progress  task  high    Confirm the retry budget for the upload endpoint  ac 0/2  @claude  -
      Should the retry budget be shared with the download endpoint or kept separate?
  ```

  The task doesn't change state just for having an open question: it still counts as in progress
  for its record, but it leaves the `IN PROGRESS` block of the startup message and shows up here
  instead, so nobody mistakes it for forgotten, or for active at the same time.
teaches:
  - >-
    Parking and unparking are their own commands, `biso ask` and `biso answer`, and neither one
    changes the task's state.
  - >-
    A parked task shows up from the outside in the `NEEDS ANSWER` block of the startup message
    and not in `IN PROGRESS`, even though its state is still the active one.
  - >-
    Asking is better than guessing. It's rule 10 of the `biso prime` message, and it's the whole
    reason `biso ask` exists.
  - >-
    The `biso answer` command turns the question into two comments in the same write: one with
    the original author and moment of the question, and another with the answer, signed now.
steps:
  - narration: |
      You look closely at TASK-60's question, not just the trimmed line from the startup message.
    command: biso get TASK-60 --section question
    output: |
      TASK-60  Confirm the retry budget for the upload endpoint

      ## Open Question
      @claude, 2026-09-06 09:30
      Should the retry budget be shared with the download endpoint or kept separate?
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/get.md "`biso get`"
  - narration: |
      Now yours. Instead of picking a number out of thin air, you leave it written down as a
      question.
    command: 'biso ask TASK-19 "What is the maximum number of retries before treating the 5xx as a definitive failure? Is there already a reference value somewhere else in the code, or does a new one need to be set?"'
    output: |
      TASK-19  In Progress  ac 0/2  urgency 7.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/verbos-del-ciclo.md#biso-ask "`biso ask`"
      - spec/modelo-de-datos/urgencia.md#la-urgencia "La urgencia"
    remark: |
      The state doesn't change, it's still In Progress. Urgency does drop, from 11.0 to 7.0: the
      formula's activity term requires the task to be in the active state *and* to have no open
      question, so as soon as `waiting` becomes true that term stops adding its 4.0 points. It's
      the same 4.0 drop that the specification's own example shows for TASK-11 (from 19.0 to
      15.0), here with TASK-19's numbers.
  - narration: |
      You check that it got written correctly.
    command: biso get TASK-19 --section question
    output: |
      TASK-19  Retry the upload on 5xx

      ## Open Question
      @claude, 2026-09-06 14:10
      What is the maximum number of retries before treating the 5xx as a definitive failure? Is there already a reference value somewhere else in the code, or does a new one need to be set?
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/get.md "`biso get`"
      - spec/modelo-de-datos/pregunta-abierta.md#la-pregunta-abierta "La pregunta abierta"
  - narration: |
      A while later, looking at a similar endpoint, you find the answer yourself: there's already
      a value fixed somewhere else in the code. You answer, and the task gets unparked.
    command: 'biso answer TASK-19 "There is already a reference value: the download endpoint uses 3 retries with exponential backoff in retry.go. Use the same value and the same logic here."'
    output: |
      TASK-19  In Progress  ac 0/2  urgency 11.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/verbos-del-ciclo.md#biso-answer "`biso answer`"
      - spec/modelo-de-datos/urgencia.md#la-urgencia "La urgencia"
    remark: |
      Urgency is back to its earlier 11.0: waiting is false again, and the activity term goes
      back to adding its 4.0 points.
  - narration: |
      You look at the comments to see how the trail turned out.
    command: biso get TASK-19 --section comments
    output: |
      TASK-19  Retry the upload on 5xx

      ## Comments
      #1  @claude, 2026-09-06 14:10
      What is the maximum number of retries before treating the 5xx as a definitive failure? Is there already a reference value somewhere else in the code, or does a new one need to be set?

      #2  @claude, 2026-09-06 15:30
      There is already a reference value: the download endpoint uses 3 retries with exponential backoff in retry.go. Use the same value and the same logic here.
    exit_code: 0
    source_kind: derived
    source:
      - spec/modelo-de-datos/comentarios.md#los-comentarios "Los comentarios"
      - spec/modelo-de-datos/fechas.md#las-fechas "Las fechas"
      - spec/cmd/get.md "`biso get`"
      - spec/cmd/verbos-del-ciclo.md#biso-answer "`biso answer`"
    remark: |
      The first comment carries the moment the question was asked (14:10), not the moment it was
      answered (15:30): that's the one documented exception to the rule, the question gets
      carried over exactly as the program first recorded it. The two comments appear in the order
      `biso answer` wrote them, which is also their insertion order, and that's the order that
      gets stored and shown, not the order their timestamps would suggest.
board_in: >
  TASK-19 in In Progress, ac 0/2 (keys #7 and #8), with no comments or open question.
  Urgency 11.0. Board counters: 54/5/190, unchanged since scenario 7.
board_out: >
  TASK-19 is still In Progress, ac 0/2 untouched. It now has 2 comments, in this
  order: the question that got it parked (with its original moment) and the answer that unparked
  it. It's back to having no open question (waiting is false). Urgency back to 11.0, after
  dropping to 7.0 while it waited for an answer. Board counters unchanged: 54/5/190. TASK-60 isn't
  modified in this scenario, it's only looked at as a reference for what an open question looks
  like from the outside.
