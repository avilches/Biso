id: 07-falta-un-criterio
title: Halfway through, a criterion is missing
situation: |
  You've been at `TASK-19` for a while. You're noting down what you check, but you still haven't
  written a definition of done: not a word about what has to happen, beyond the acceptance
  criteria, for this task to really count as finished. You stop to write it down before going on.

  You check first whether there's already something there.
teaches:
  - >-
    The bare name of a list field adds; `--set-` replaces the whole list; `--rm-` removes one;
    `--clear-` empties it. The four forms work the same way for any list field, not just for the
    definition of done.
  - >-
    The `#N` keys of a criterion, whether an acceptance criterion or a definition-of-done item,
    get assigned when the element is created and are never reassigned. Removing one from the
    middle doesn't renumber the ones that are left.
  - >-
    A list's key counter only ever grows, even after `--clear-`. Elements added after emptying
    the list don't get back the keys of the ones that were removed.
steps:
  - narration: |
      You ask for just that section, so you don't pull the whole record for something you already
      know is going to be empty.
    command: biso get TASK-19 --section dod
    output: ""
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/get.md "`biso get`"
    remark: |
      Not even the header shows up. `biso get`'s rule is literal: with `--section`, an empty
      section doesn't get printed, and if no section is left to print, the whole output is empty.
      That's different from asking for the full record, where every empty section shows up
      anyway, marked `(empty)`. The flag changes the standard on purpose: without it, leaving a
      section out would blur "empty" with "not requested"; with it, you asked for exactly that
      section, so "empty" no longer needs saying.
  - narration: |
      You write down the first thing that comes to mind: that the change should be reviewed by
      someone else before it counts as done.
    command: biso set TASK-19 --dod "Someone else reviews the change before the task counts as done"
    output: |
      TASK-19  In Progress  ac 0/2  dod 0/1  urgency 11.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/familias-de-banderas.md#campos-de-lista "Campos de lista"
      - spec/cmd/set.md "`biso set`"
      - spec/modelo-de-datos.md#la-urgencia "La urgencia"
    remark: |
      The bare `--dod` flag adds. It's the same verb you already know from `--ac`: it behaves
      the same way for any list field.
  - narration: |
      And a second thing that needs to be clear before closing: that the retry behavior gets
      documented somewhere, for whoever reads this later.
    command: biso set TASK-19 --dod "The retry behavior is documented in the README"
    output: |
      TASK-19  In Progress  ac 0/2  dod 0/2  urgency 11.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/familias-de-banderas.md#campos-de-lista "Campos de lista"
      - spec/cmd/set.md "`biso set`"
      - spec/modelo-de-datos.md#la-urgencia "La urgencia"
  - narration: |
      You check how they turned out, with their keys.
    command: biso get TASK-19 --section dod
    output: |
      TASK-19  Retry the upload on 5xx

      ## Definition of Done
      - [ ] #1 Someone else reviews the change before the task counts as done
      - [ ] #2 The retry behavior is documented in the README
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/get.md "`biso get`"
  - narration: |
      On second thought, the first one is redundant: having someone else review the change is
      already team policy for any PR, not something specific to this task. You remove it.
    command: biso set TASK-19 --rm-dod 1
    output: |
      TASK-19  In Progress  ac 0/2  dod 0/1  urgency 11.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/familias-de-banderas.md#campos-de-lista "Campos de lista"
      - spec/familias-de-banderas.md#selectores-de-criterios "Selectores de criterios"
      - spec/cmd/set.md "`biso set`"
  - narration: |
      You check the list again to make sure what's left hasn't changed number.
    command: biso get TASK-19 --section dod
    output: |
      TASK-19  Retry the upload on 5xx

      ## Definition of Done
      - [ ] #2 The retry behavior is documented in the README
    exit_code: 0
    source_kind: derived
    source:
      - spec/modelo-de-datos.md#los-criterios-y-sus-claves-estables "Los criterios y sus claves estables"
      - spec/cmd/get.md "`biso get`"
    remark: |
      This is the central point of the scenario. The surviving element is still `#2`, it hasn't
      become `#1`. The program fixes a key when the element is created and never moves it: that's
      why checking or removing by number is safe even when the list has lost elements along the
      way, and why a task can perfectly well have criteria `#2` and `#7` without that being
      anyone's mistake.
  - narration: |
      A coworker reviews the wording and suggests rewriting the whole list at once, adding a
      second entry about the tests that are needed.
    command: biso set TASK-19 --set-dod "The README explains when and how many times it retries" --set-dod "The test suite covers the 5xx case"
    output: |
      warning: --set-dod replaced 46 bytes of existing content
      TASK-19  In Progress  ac 0/2  dod 0/2  urgency 11.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/salida-y-terminal.md#notas-y-avisos "Notas y avisos"
      - spec/familias-de-banderas.md#campos-de-lista "Campos de lista"
      - spec/cmd/set.md "`biso set`"
    remark: |
      `--set-dod` replaces the whole list. Element `#2` disappears along with the rest of the old
      list, and the two that come in are brand new elements.

      The warning about replaced bytes is described for "any --set-* that overwrites non-empty
      content," without restricting it to prose fields, but the only example the specification
      gives is for `--set-plan` (a single string), and it doesn't say how the bytes are counted
      when what gets replaced is a list with several elements, each with its own text. Here it's
      been taken as the UTF-8 bytes of the text of the single element that was there before the
      replacement (46, the ones in "The retry behavior is documented in the README"),
      as the closest reading to the single-string case the specification does cover. Noted as an
      open gap in tutorial/lagunas/07-10.md.
  - narration: |
      You check the keys of the two new ones.
    command: biso get TASK-19 --section dod
    output: |
      TASK-19  Retry the upload on 5xx

      ## Definition of Done
      - [ ] #3 The README explains when and how many times it retries
      - [ ] #4 The test suite covers the 5xx case
    exit_code: 0
    source_kind: derived
    source:
      - spec/modelo-de-datos.md#los-criterios-y-sus-claves-estables "Los criterios y sus claves estables"
      - spec/familias-de-banderas.md#campos-de-lista "Campos de lista"
      - spec/cmd/get.md "`biso get`"
    remark: |
      The keys are `#3` and `#4`, not `#1` and `#2`. This list's counter, inside this task, was
      already at 2 before anything got replaced, and replacing doesn't reset it: "the keys of
      earlier elements are never reused" holds even when the replacement comes after an `--rm-`,
      not just right after creating the task.
  - narration: |
      Almost right away you realize you're polishing the wording before the code is properly
      settled. You'd rather leave it blank until the work is more mature.
    command: biso set TASK-19 --clear-dod
    output: |
      TASK-19  In Progress  ac 0/2  urgency 11.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/familias-de-banderas.md#campos-de-lista "Campos de lista"
      - spec/cmd/set.md "`biso set`"
    remark: |
      The list ends up empty, and that's why the `dod` chunk disappears from the status line: it
      only shows up "whenever the task has a definition of done," and an empty list doesn't count
      as having one. `ac` keeps showing because those two criteria haven't been touched.
  - narration: |
      A while later, with the retry already working, you go back to the final list. It's the
      same wording as before.
    command: biso set TASK-19 --dod "The README explains when and how many times it retries" --dod "The test suite covers the 5xx case"
    output: |
      TASK-19  In Progress  ac 0/2  dod 0/2  urgency 11.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/familias-de-banderas.md#campos-de-lista "Campos de lista"
      - spec/cmd/set.md "`biso set`"
      - spec/modelo-de-datos.md#la-urgencia "La urgencia"
    remark: |
      Bare name, adds again. The keys of these two elements are `#5` and `#6`: the list's
      counter hasn't been reset either by the earlier `--rm-dod` or by the later `--clear-dod`,
      it "only ever grows," no matter what happens to the list's content.
board_in: >
  TASK-19 in In Progress, assigned to @claude, with a live lease held by @claude (renewed in
  scenario 6). ac 0/2 unchecked (the two criteria it carries from the initial inventory). No
  definition of done. Urgency 11.0 (priority high 6.0, active 4.0, has criteria 1.0, no due date
  or declared dependencies; the age term is taken as 0 for lack of a documented creation date for
  this task, see tutorial/lagunas/07-10.md). Board counters: To Do 54 | In Progress 5 | Done 190,
  as they stand after scenario 5 (which moves TASK-19 from To Do to In Progress) without scenario
  6 touching them.
board_out: >
  TASK-19 is still In Progress, with no change in assignment, state or lease. ac 0/2 unchecked,
  untouched in this scenario. dod 0/2, with keys #5 and #6: keys #1 through #4 were used and
  discarded during the scenario (#1 was removed with --rm-dod, #2 through #4 were replaced with
  --set-dod and then emptied with --clear-dod). Urgency unchanged, 11.0. Board counters unchanged:
  54/5/190, because no step in this scenario moves a task between states.
