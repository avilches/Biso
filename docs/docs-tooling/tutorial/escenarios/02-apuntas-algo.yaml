id: 02-apuntas-algo
title: Something comes to mind and you don't want to lose it
situation: |
  You're in the middle of something else when you notice something that needs fixing in
  the file uploader. It's not what you're working on right now, and if you keep pulling on
  that thread you lose track of the real task. All you need is to write it down somewhere
  it won't get forgotten, and keep going.
teaches:
  - "Each field flag says what it does in its own name. Repeating `--add-ac` twice
    leaves two criteria, not one overwriting the other."
  - "`biso new` prints the new task's id and nothing else: no title echoed back as
    confirmation, no status line."
steps:
  - narration: |
      Just typing the title would already keep it safe, but since it's already in your
      head, it's worth also writing down why it matters and what criterion will tell you
      it's resolved. That's two more flags on the same line, and `new` accepts all of them:
    command: >-
      biso new "Log the diff size before uploading" --add-ac "The log prints the diff size
      before each upload" --add-ac "The size also shows up when the upload fails"
    output: |
      TASK-62
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/new.md "`biso new`"
    remark: |
      No "created TASK-62", no repeating the title: the only line is the id, because that's
      exactly what you couldn't have known beforehand, and you already knew everything else
      (rule 6 of the startup message, and one of the core principles: the default output of
      a write is whatever the caller didn't already know, never an echo of what it just
      wrote). The two `--add-ac` flags haven't replaced anything, they've added two separate
      criteria to a list that started out empty, because that is exactly what `--add-ac`
      says it does. There is no flag that replaces the whole list of criteria: doing that
      means clearing it and adding again in the same call, though you didn't need that
      here, a freshly created task has nothing to clear yet.
board_in: |
  54/4/190 (To Do / In Progress / Done), same as at the end of scenario 1.
board_out: |
  TASK-62 is created in the initial state, To Do, with two unchecked acceptance criteria and
  no one assigned. Counters 55/4/190.
