id: 09-la-persona-y-el-agente-hablan
title: The person and the agent talk
situation: |
  With the retry question settled, you keep implementing TASK-19. You keep a record of what you
  check, so whoever reads the task later doesn't have to re-read the whole diff. But something
  also comes in from outside that isn't yours: a user has reported a problem through another
  channel, and someone asks you to leave it noted on the task. These are two different things and
  it's easy to mix them up: an implementation note is your own notebook, with no author or
  timestamp per entry; a comment is a conversation, and it always carries who wrote it and when.
teaches:
  - >-
    The `biso note` command adds a paragraph to the implementation notes. It's a block of prose
    with no author or timestamp per element, the technical notebook of whoever is doing the work.
  - >-
    The `biso comment` command adds a comment with an author and a timestamp. It's the channel
    for anything that comes from outside, and the way to talk with a person.
  - >-
    A comment's default author is the resolved identity (`me`). `--comment-author` lets you
    sign it with another one, free text and unvalidated, to relay something that came from
    another system.
steps:
  - narration: |
      You finish fitting the retry with the same pattern the download endpoint already used, and
      leave a record of how it turned out.
    command: biso note TASK-19 "The exponential backoff in retry.go can be reused as-is; the limit just needs to be set to 3."
    output: |
      TASK-19  In Progress  ac 0/2  urgency 11.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/verbos-del-ciclo.md#biso-note "`biso note`"
      - spec/modelo-de-datos/urgencia.md#la-urgencia "La urgencia"
  - narration: |
      You check how that note turned out.
    command: biso get TASK-19 --section notes
    output: |
      TASK-19  Retry the upload on 5xx

      ## Implementation Notes
      The exponential backoff in retry.go can be reused as-is; the limit just needs to be set to 3.
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/get.md "`biso get`"
    remark: |
      There's no author or timestamp next to the text. Notes don't have that structure: they're a
      single block of prose that each `--note` adds a paragraph to, not a list of entries with an
      author like comments. If you needed to know who wrote a note or when, you wouldn't be able
      to: that's not the kind of data it is.
  - narration: |
      You get a heads-up: a user on a mobile connection sees failures even with the retry in
      place. It's not something you saw yourself, so you enter it as a comment, signed with
      whoever reported it.
    command: 'biso comment TASK-19 "A user on a mobile connection sees failures even after the 3 retries, should we raise the limit in that case?" --comment-author @trello:juan'
    output: |
      note: comment #3 by @trello:juan
      TASK-19  In Progress  ac 0/2  urgency 11.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/verbos-del-ciclo.md#biso-comment "`biso comment`"
      - spec/modelo-de-datos/comentarios.md#los-comentarios "Los comentarios"
      - spec/familias-de-flags.md#comentarios "Comentarios"
    remark: |
      "note: comment #3 by @trello:juan" goes to stderr, in the exact shape the specification's
      own example gives. The number is a stable key, exactly like a criterion's: it's assigned
      once when the comment is created and never reassigned, even if an earlier comment is later
      removed with `--rm-comment`. A comment's body and author are never edited, by any flag; only
      its date can be corrected, with `--set-comment-date`, and the whole comment can be removed
      entirely. This is TASK-19's third comment because `biso answer` had already added two in the
      previous scenario.
  - narration: |
      You answer yourself, as yourself, with no author flags: the configured identity signs by
      default.
    command: biso comment TASK-19 "Not for now, 3 retries is the policy for the rest of the system; if it happens again we'll revisit it."
    output: |
      note: comment #4 by @claude
      TASK-19  In Progress  ac 0/2  urgency 11.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/verbos-del-ciclo.md#biso-comment "`biso comment`"
      - spec/modelo-de-datos/comentarios.md#los-comentarios "Los comentarios"
    remark: |
      Without --comment-author, the author is `me`, this session's resolved identity: @claude.
      It's the same `--comment-author` that exists on every write command, not just `biso
      comment`: the name doesn't change just because it looks redundant on `biso comment`.
  - narration: |
      You put the two sections side by side to see the contrast at a glance.
    command: biso get TASK-19 --section notes,comments
    output: |
      TASK-19  Retry the upload on 5xx

      ## Implementation Notes
      The exponential backoff in retry.go can be reused as-is; the limit just needs to be set to 3.

      ## Comments
      #1  @claude, 2026-09-06 14:10
      What is the maximum number of retries before treating the 5xx as a definitive failure? Is there already a reference value somewhere else in the code, or does a new one need to be set?

      #2  @claude, 2026-09-06 15:30
      There is already a reference value: the download endpoint uses 3 retries with exponential backoff in retry.go. Use the same value and the same logic here.

      #3  @trello:juan, 2026-09-06 16:05
      A user on a mobile connection sees failures even after the 3 retries, should we raise the limit in that case?

      #4  @claude, 2026-09-06 16:20
      Not for now, 3 retries is the policy for the rest of the system; if it happens again we'll revisit it.
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/get.md "`biso get`"
      - spec/modelo-de-datos/comentarios.md#los-comentarios "Los comentarios"
    remark: |
      Notes are a single block; comments are four signed entries, in the order they were written.
      `## Implementation Notes` comes before `## Comments` even though the flag asked for them in
      the opposite order (`notes,comments`): the print order of sections is the fixed order of
      the full record, not the order they're listed in `--section`. The specification doesn't say
      this explicitly for the case of several sections at once; noted as an open gap in
      tutorial/lagunas/07-10.md.
board_in: >
  TASK-19 in In Progress, ac 0/2 (keys #7 and #8), with 2 comments (the question and answer from scenario
  8) and no notes yet. Urgency 11.0. Board counters: 54/5/190, unchanged since scenario 8.
board_out: >
  TASK-19 is still In Progress, ac 0/2 untouched. It now has 1 implementation note
  paragraph and 4 comments in total: the 2 from the question and answer in scenario 8, plus the
  one from @trello:juan and @claude's answer in this scenario. Urgency unchanged, 11.0. Board
  counters unchanged: 54/5/190.
