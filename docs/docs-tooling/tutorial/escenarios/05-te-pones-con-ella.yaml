id: 05-te-pones-con-ella
title: You get to work on it
situation: |
  The agent already knows `TASK-19` is his. Now he's going to actually start it, and that isn't
  done by changing the state by hand: there's a command named exactly after the move you're
  making.

  One single call does four things at once, and you didn't ask for one of them.
teaches:
  - >-
    Starting a task is a command with its own name, `biso start`, and it costs one call. It is
    not `biso set --status`, even though the state ends up the same.
  - >-
    Starting creates a lease: a reservation with an expiry date that says someone is working on
    that task right now. No other command creates one.
  - >-
    A lease is not a state. The task is `In Progress` and also holds a reservation; those are two
    separate things stored apart from each other.
steps:
  - narration: |
      The agent takes the task, and along the way writes down how he plans to attack it, so Sara
      can read it without having to ask.
    command: biso start TASK-19 --plan "Reproduce the 5xx with a test server, and wrap the upload in a retry with exponential backoff"
    output: |
      TASK-19  In Progress  ac 0/2  urgency 11.0
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/verbos-del-ciclo.md#biso-start "`biso start`"
      - spec/modelo-de-datos.md#la-urgencia "La urgencia"
    remark: |
      The urgency has gone up from 7.0 to 11.0, and that's exactly the 4.0 of the active-task
      term. Nobody wrote that number: it gets recalculated on every read.

      What the output doesn't say is the most important part of this step. `biso start` has done
      four things in a single write: it set the active state, it checked that the task already
      had someone assigned (`@claude`, since scenario 4, so it didn't touch that), **it took the
      lease** in the caller's name, and it added the plan.

      If the task had had nobody assigned, `start` would have assigned it to whoever called it,
      and that's the difference with what Sara did in the previous scenario: she assigned without
      starting, and `start` starts by assigning if it has to.
  - narration: |
      The lease doesn't show up in the status line, so the agent looks at the task's record to
      understand what he just reserved.
    command: biso get TASK-19 --section plan
    output: |
      TASK-19  Retry the upload on 5xx

      ## Implementation Plan
      Reproduce the 5xx with a test server, and wrap the upload in a retry with exponential
      backoff
    exit_code: 0
    source_kind: derived
    source:
      - spec/cmd/get.md "`biso get`"
    remark: |
      The plan is right where it should be. The lease needs explaining, because this step doesn't
      show it directly: it's two fields stored on the task, until when the reservation is good and
      who holds it, and the program just set them to "now plus 240 minutes" and `@claude`.

      Those 240 minutes are the `lease_minutes` key in the board's configuration, and you can
      change it whenever you want without breaking anything: the expiry is computed at write time,
      so changing it only affects leases that get renewed from that point on.

      The default is generous on purpose. The mistake that costs you is a false expiry, not a late
      one: too short a lease lets another agent claim a task someone is genuinely working on,
      while too long a lease only delays a warning. And as you'll see in the next scenario, that
      warning never stops anyone from working.
board_in: >
  TASK-19 in To Do, assigned to @claude, ac 0/2, urgency 7.0, with no plan and no lease, exactly
  as scenario 4 leaves it. Counters 55/4/190.
board_out: >
  TASK-19 in In Progress, assigned to @claude, ac 0/2, urgency 11.0, with a plan and a live lease
  in @claude's name that expires 240 minutes after this step. Counters 54/5/190: TASK-19 leaves To
  Do and enters In Progress, the only state change in this scenario.
