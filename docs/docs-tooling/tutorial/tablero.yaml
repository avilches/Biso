# Inventario de partida del tablero de ejemplo "Kex".
#
# Los comentarios de este fichero citan la especificacion por el numero de sus secciones, como se
# escribio en su dia. docs/SPEC.md se reparto despues en los documentos de docs/spec/, que se citan
# por el titulo de sus secciones; para traducir una referencia de aqui, mira
# docs/docs-tooling/tools/mapa-de-secciones.txt.
#
# Tomado de la tabla normativa de
# docs/superpowers/specs/2026-09-10-tutorial-por-escenarios-design.md y comprobado contra la
# salida literal de `biso prime` en la sección 9.7 de docs/SPEC.md (identificador, estado,
# tipo, prioridad, título, avance de criterios de aceptación y persona asignada) y contra la
# ficha de TASK-11 y la sección "Open Question" de TASK-60 en la sección 10.5.
#
# Esto no son las 248 tareas del tablero: son las nueve que el tutorial nombra y sigue, más
# los contadores reales de cada estado. Las demás tareas (49 en To Do sin detalle y las 190 de
# Done) no hacen falta para ningún escenario, y por eso no están aquí; el contador de
# "board.counts" sí las incluye, porque esos números son los que "biso prime" imprime.
#
# El texto de los criterios de aceptación y de la definición de hecho que la SPEC no da
# literalmente (solo da su recuento, columna "ac" de la tabla 9.7) está inventado para que la
# semilla sea utilizable; no es texto literal de docs/SPEC.md salvo donde se indica en un
# comentario junto al campo.
#
# El día que exista el binario, este fichero sembrará un tablero real para ejecutar contra él
# los fixtures de tutorial/escenarios/.

board:
  project_name: Kex
  task_prefix: TASK
  # Los tres papeles obligatorios: inicial, activo y terminal (SPEC 6 / vocabulario).
  statuses:
    - name: To Do
      role: initial
    - name: In Progress
      role: active
    - name: Done
      role: terminal
  types: [idea, memory, task, bug, docs]
  priorities: [high, medium, low]
  # La identidad no es una propiedad de este tablero: vive en la configuracion de maquina de
  # cada actor (docs/spec/invocacion.md#configuración-de-máquina), y BISO_ME gana siempre sobre
  # ella. Por eso no hay ninguna clave de identidad que sembrar aqui: cada actor declara la
  # suya por entorno, y de ahi sale el "you are @claude" que imprime `biso prime` en SPEC 9.7.
  # Las identidades que aparecen en el tutorial, cada una en su propia sesion via BISO_ME.
  identidades:
    - "@claude"   # el agente, protagonista del recorrido
    - "@sara"     # la persona que reparte trabajo y responde preguntas
    - "@bob"      # tenedor del arrendamiento vencido de TASK-52, no actua en ningun escenario
  lease_minutes: 240
  # El dia que el tutorial toma como "hoy". No sale de docs/SPEC.md, que no lo declara en ningun
  # sitio, sino de que es el unico valor que hace coherentes las fechas que el propio inventario
  # ya trae: el vencimiento del arrendamiento de TASK-52 (2026-09-05, que tiene que estar en el
  # pasado) y la fecha limite de TASK-7 (2026-09-08, que tiene que estar en el futuro). Hace
  # falta porque el termino de proximidad de la urgencia (SPEC 5.4) se calcula contra hoy.
  hoy: "2026-09-06"
  # Recuento real por estado, literal de SPEC 9.7. Solo cambia cuando un escenario mueve una
  # tarea de estado; el escenario que la mueve es responsable de actualizarlo aqui.
  counts:
    To Do: 54
    In Progress: 4
    Done: 190

