        text: Revisado por otra persona
        checked: false
    # Arrendamiento literal de SPEC 10.5: leaseExpiresAt y leaseHolder de la ficha de TASK-11.
    lease:
      expires_at: "2026-09-06T15:40:18Z"
      holder: "@claude"

