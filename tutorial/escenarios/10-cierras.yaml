id: 10-cierras
titulo: Cierras
situacion: |
  El reintento funciona, está documentado y hay quien lo ha revisado por encima en los
  comentarios. Antes de cerrar TASK-19 repasas los criterios de aceptación, y te das cuenta de
  que dos cosas que ya has hecho nunca quedaron anotadas como criterio: el backoff y las
  pruebas. Las añades antes de marcar nada, para que la ficha final cuente la historia completa.
ensena:
  - >-
    Las banderas `--check` y `--uncheck` (y sus pares `--check-dod` y `--uncheck-dod`) aceptan
    cinco formas de selector, todas repetibles y todas combinables en la misma llamada, una
    clave suelta, un rango, una lista separada por comas, `all`, o el texto del criterio.
  - >-
    Marcar o desmarcar es siempre seguro de repetir. `--check all` no rompe nada aunque ya
    estuviera todo marcado, y por eso el cierre de un ciclo siempre puede llevarlo sin mirar
    antes qué falta.
  - >-
    Cerrar una tarea vacía siempre su arrendamiento, lo tenga quien lo tenga. Es la invariante
    que gobierna cualquier escritura que saca una tarea del estado activo, y `biso finish` la
    aplica sin excepción.
pasos:
  - narracion: |
      Añades los dos criterios que te faltaban, de una vez.
    comando: biso set TASK-19 --ac "El backoff sigue el mismo patron que el endpoint de descargas" --ac "Hay un test que cubre el caso de 5xx repetido" --ac "Hay un test que cubre el caso de exito tras reintentar" --ac "La documentacion del endpoint menciona el limite de reintentos"
    salida: |
      TASK-19  In Progress  ac 0/6  dod 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada SPEC 8.2, 10.6, 5.1
    comentario: |
      Cuatro `--ac` en la misma llamada añaden cuatro elementos nuevos, en el orden en que se
      escriben (4.9), con claves nuevas, #3, #4, #5 y #6, detrás de los #1 y #2 que ya tenía la
      tarea desde el inventario inicial.
  - narracion: |
      Marcas el primero, el que ya tenías comprobado desde el principio.
    comando: biso set TASK-19 --check 1
    salida: |
      TASK-19  In Progress  ac 1/6  dod 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada SPEC 8.4, 10.6
  - narracion: |
      Los tres que probaste juntos con el mismo test, de una vez, con un rango.
    comando: biso set TASK-19 --check 3-5
    salida: |
      TASK-19  In Progress  ac 4/6  dod 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada SPEC 8.4, 10.6
  - narracion: |
      Y dos que no son consecutivos, con una lista separada por comas.
    comando: biso set TASK-19 --check 2,6
    salida: |
      TASK-19  In Progress  ac 6/6  dod 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada SPEC 8.4, 10.6
  - narracion: |
      Casi al momento te das cuenta de que el #2 (el del contador en el log) lo diste por bueno
      demasiado pronto, el número de intentos todavía no se ve en el log, solo el resultado
      final. Lo desmarcas.
    comando: biso set TASK-19 --uncheck 2
    salida: |
      TASK-19  In Progress  ac 5/6  dod 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada SPEC 8.4, 10.6
    comentario: |
      `--uncheck` toma el mismo selector que `--check`, con el mismo efecto invertido, aquí
      "uno suelto", igual que el primer `--check` de este escenario.
  - narracion: |
      En la definición de hecho, marcas el que ya está cerrado buscando por su texto, no por
      número.
    comando: biso set TASK-19 --check-dod "README"
    salida: |
      TASK-19  In Progress  ac 5/6  dod 1/2  urgency 11.0
    codigo_salida: 0
    origen: derivada SPEC 8.4, 10.6
    comentario: |
      "README" no encaja con la gramática de claves de 8.4 (^(all|\d+(-\d+)?)(,\d+(-\d+)?)*$), así
      que se trata como texto literal y busca el elemento cuyo texto lo contenga. Solo el #5
      ("El README explica cuándo y cuántas veces se reintenta") encaja, así que no hay ambigüedad.
  - narracion: |
      Añades el número de intentos al log, comprueba que ahora sí aparece, y cierras la tarea.
      Marcas todo lo que quede de una vez, por si te has dejado algo suelto, y escribes el
      resumen.
    comando: biso finish TASK-19 --check all --check-dod all --summary "Retry con el mismo backoff que el endpoint de descargas, tope de 3 intentos, contador visible en el log."
    salida: |
      TASK-19  Done  ac 6/6  dod 2/2  urgency 0.0
    codigo_salida: 0
    origen: derivada SPEC 10.6, 10.7.4, 5.4
    comentario: |
      `--check all` vuelve a marcar el #2, que habías desmarcado, y no toca los otros cinco, ya
      estaban marcados, y marcar dos veces el mismo criterio "se queda marcado, sin aviso, la
      operación es idempotente" (8.4). `--check-dod all` marca el #6, el único que quedaba. La
      urgencia pasa a 0.0 porque el estado terminal la fija así por definición (5.4), no porque
      se recalcule con la fórmula de siempre.

      Lo que esta línea no dice, y conviene saber, es que cerrar una tarea vacía siempre
      `leaseExpiresAt` y `leaseHolder`, sea quien sea quien la tenga (sección 5, séptima
      precisión, citada de nuevo en 10.6 y en 10.7.4). TASK-19 llevaba el arrendamiento de
      @claude desde el escenario 5; con este `biso finish` queda sin arrendamiento, y quedaría
      igual de vacío aunque lo hubiera tenido otra identidad. La invariante gana siempre sobre
      la regla general de "una escritura ajena no toca el arrendamiento": una tarea terminada
      con arrendamiento vivo es un estado que ni la propia importación del tablero aceptaría.
tablero_entra: >
  TASK-19 en In Progress, ac 0/2 (2 criterios sin marcar), dod 0/2 (claves #5 y #6, sin marcar),
  4 comentarios, 1 párrafo de notas de implementación, con arrendamiento vivo de @claude.
  Urgencia 11.0. Contadores del tablero: 54/5/190, sin cambios desde el escenario 9.
tablero_sale: >
  TASK-19 en Done. ac 6/6: los 2 criterios originales más los 4 añadidos en este escenario
  (claves #1 a #6), todos marcados. dod 2/2 (claves #5 y #6), todos marcados. Lleva resumen
  final. El arrendamiento queda vacío, leaseExpiresAt y leaseHolder sin valor, por la invariante
  de la sección 5 que vacía los dos campos en cualquier escritura que saca la tarea del estado
  activo, y llegar al estado terminal lo hace siempre. Urgencia 0.0, por ser el estado terminal.
  Contadores del tablero: To Do 54 | In Progress 4 | Done 191, porque TASK-19 sale de In
  Progress y entra en Done. La espina dorsal del tutorial (TASK-19, seguida desde el escenario 4
  hasta aquí) queda cerrada.
