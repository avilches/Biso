id: 07-falta-un-criterio
titulo: A mitad, falta un criterio
situacion: |
  Llevas un rato con `TASK-19` abierta. Vas anotando lo que compruebas, pero todavía no le has
  puesto ninguna definición de hecho: ni una palabra sobre qué tiene que pasar, aparte de los
  criterios de aceptación, para que esta tarea se pueda dar por cerrada de verdad. Te paras a
  escribirla antes de seguir.

  Miras primero si ya hay algo.
ensena:
  - >-
    El nombre desnudo de un campo de lista añade; `--set-` sustituye la lista entera; `--rm-`
    quita uno; `--clear-` la vacía. Las cuatro formas valen igual para cualquier campo de lista,
    no solo para la definición de hecho.
  - >-
    Las claves `#N` de un criterio, sea de aceptación o de la definición de hecho, se asignan al
    crear el elemento y no se reasignan nunca. Quitar uno de en medio no corre la numeración de
    los que quedan.
  - >-
    El contador de claves de una lista solo crece, también después de `--clear-`. Los elementos
    que se añaden después de vaciar la lista no recuperan las claves de los que se quitaron.
pasos:
  - narracion: |
      Pides solo esa sección, para no traerte la ficha entera por algo que sabes que va a estar
      vacío.
    comando: biso get TASK-19 --section dod
    salida: ""
    codigo_salida: 0
    origen: derivada spec/cmd/get.md
    comentario: |
      No sale ni la cabecera. La regla de 10.5 es literal: con `--section`, una sección vacía no
      se imprime, y si no queda ninguna sección que imprimir la salida entera está vacía. Eso es
      distinto de pedir la ficha completa, donde toda sección vacía sale igual, marcada con
      `(empty)`. La bandera cambia el criterio a propósito: sin ella, omitir confundiría "vacío"
      con "no pedido"; con ella pediste justo eso, así que "vacío" ya no necesita decirse.
  - narracion: |
      Escribes lo primero que se te ocurre: que el cambio lo revise alguien más antes de darlo
      por bueno.
    comando: biso set TASK-19 --dod "El cambio lo revisa otra persona antes de dar la tarea por terminada"
    salida: |
      TASK-19  In Progress  ac 0/2  dod 0/1  urgency 11.0
    codigo_salida: 0
    origen: derivada spec/familias-de-banderas.md#campos-de-lista, spec/cmd/set.md, spec/modelo-de-datos.md#la-urgencia
    comentario: |
      El nombre desnudo `--dod` añade. Es el mismo verbo que ya conoces de `--ac`: se comporta
      igual en cualquier campo de lista.
  - narracion: |
      Y una segunda cosa que tiene que quedar clara antes de cerrar: que el comportamiento del
      reintento quede explicado en algún sitio, para quien lo lea después.
    comando: biso set TASK-19 --dod "El comportamiento del retry queda documentado en el README"
    salida: |
      TASK-19  In Progress  ac 0/2  dod 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada spec/familias-de-banderas.md#campos-de-lista, spec/cmd/set.md, spec/modelo-de-datos.md#la-urgencia
  - narracion: |
      Compruebas cómo han quedado, con sus claves.
    comando: biso get TASK-19 --section dod
    salida: |
      TASK-19  Retry the upload on 5xx

      ## Definition of Done
      - [ ] #1 El cambio lo revisa otra persona antes de dar la tarea por terminada
      - [ ] #2 El comportamiento del retry queda documentado en el README
    codigo_salida: 0
    origen: derivada spec/cmd/get.md
  - narracion: |
      Pensándolo mejor, el primero sobra: que otra persona revise el cambio ya es política del
      equipo para cualquier PR, no algo específico de esta tarea. Lo quitas.
    comando: biso set TASK-19 --rm-dod 1
    salida: |
      TASK-19  In Progress  ac 0/2  dod 0/1  urgency 11.0
    codigo_salida: 0
    origen: derivada spec/familias-de-banderas.md#campos-de-lista, spec/familias-de-banderas.md#selectores-de-criterios, spec/cmd/set.md
  - narracion: |
      Vuelves a mirar la lista para comprobar que lo que queda no ha cambiado de número.
    comando: biso get TASK-19 --section dod
    salida: |
      TASK-19  Retry the upload on 5xx

      ## Definition of Done
      - [ ] #2 El comportamiento del retry queda documentado en el README
    codigo_salida: 0
    origen: derivada spec/modelo-de-datos.md#los-criterios-y-sus-claves-estables, spec/cmd/get.md
    comentario: |
      Este es el punto central del escenario. El elemento que sobrevive sigue siendo `#2`, no ha
      pasado a `#1`. La clave la fija el programa al crear el elemento y no se mueve nunca
      (5.1): por eso marcar o quitar por número es seguro incluso cuando la lista ha perdido
      elementos por el medio, y por eso una tarea puede tener perfectamente los criterios `#2` y
      `#7` sin que eso sea un error de nadie.
  - narracion: |
      Un compañero revisa la frase y sugiere reescribir toda la lista de una vez, con una
      segunda entrada sobre las pruebas que hacen falta.
    comando: biso set TASK-19 --set-dod "El README explica cuando y cuantas veces se reintenta" --set-dod "El paquete de pruebas cubre el caso 5xx"
    salida: |
      warning: --set-dod replaced 58 bytes of existing content
      TASK-19  In Progress  ac 0/2  dod 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada spec/salida-y-terminal.md#notas-y-avisos, spec/familias-de-banderas.md#campos-de-lista, spec/cmd/set.md
    comentario: |
      `--set-dod` sustituye la lista entera. El elemento `#2` desaparece con el resto de la
      lista vieja, y los dos que entran son elementos nuevos.

      El aviso de bytes reemplazados lo describe 4.3 para "cualquier --set-* que pise contenido
      no vacío", sin restringirlo a los campos de prosa, pero el único ejemplo que trae la
      especificación es de `--set-plan` (una cadena suelta), y no dice cómo se cuentan los bytes
      cuando lo que se sustituye es una lista con varios elementos, cada uno con su propio
      texto. Aquí se ha tomado como los bytes UTF-8 del texto del único elemento que había antes
      de sustituir (58, los de "El comportamiento del retry queda documentado en el README"),
      por ser la lectura más cercana al caso de una sola cadena que sí cubre la especificación.
      Queda anotado como laguna en tutorial/lagunas/07-10.md.
  - narracion: |
      Compruebas las claves de los dos nuevos.
    comando: biso get TASK-19 --section dod
    salida: |
      TASK-19  Retry the upload on 5xx

      ## Definition of Done
      - [ ] #3 El README explica cuando y cuantas veces se reintenta
      - [ ] #4 El paquete de pruebas cubre el caso 5xx
    codigo_salida: 0
    origen: derivada spec/modelo-de-datos.md#los-criterios-y-sus-claves-estables, spec/familias-de-banderas.md#campos-de-lista, spec/cmd/get.md
    comentario: |
      Las claves son `#3` y `#4`, no `#1` y `#2`. El contador de esta lista, dentro de esta
      tarea, ya iba por 2 antes de sustituir nada, y sustituir no lo reinicia: "las claves de
      los elementos anteriores no se reutilizan" vale también cuando la sustitución viene
      después de un `--rm-`, no solo justo después de crear la tarea.
  - narracion: |
      Casi al momento te das cuenta de que estás afinando la redacción antes de tener el código
      encajado del todo. Prefieres dejarla en blanco hasta que el trabajo esté más maduro.
    comando: biso set TASK-19 --clear-dod
    salida: |
      TASK-19  In Progress  ac 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada spec/familias-de-banderas.md#campos-de-lista, spec/cmd/set.md
    comentario: |
      La lista queda vacía, y por eso el trozo `dod` desaparece de la línea de estado: solo sale
      "siempre que la tarea tenga definición de hecho" (10.6), y una lista vacía no cuenta como
      tenerla. `ac` sigue saliendo porque esos dos criterios no se han tocado.
  - narracion: |
      Un rato después, con el reintento ya funcionando, retomas la lista definitiva. Es la misma
      redacción de antes.
    comando: biso set TASK-19 --dod "El README explica cuando y cuantas veces se reintenta" --dod "El paquete de pruebas cubre el caso 5xx"
    salida: |
      TASK-19  In Progress  ac 0/2  dod 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada spec/familias-de-banderas.md#campos-de-lista, spec/cmd/set.md, spec/modelo-de-datos.md#la-urgencia
    comentario: |
      Nombre desnudo, añade otra vez. Las claves de estos dos elementos son `#5` y `#6`: el
      contador de la lista no se ha reiniciado ni con el `--rm-dod` de antes ni con el
      `--clear-dod` de después, "solo crece" en palabras de 5.1, pase lo que pase con el
      contenido de la lista.
tablero_entra: >
  TASK-19 en In Progress, asignada a @claude, con arrendamiento vivo de @claude (renovado en el
  escenario 6). ac 0/2 sin marcar (los dos criterios que trae desde el inventario inicial). Sin
  definición de hecho. Urgencia 11.0 (prioridad alta 6.0, activa 4.0, tiene criterios 1.0, sin
  fecha límite ni dependencias declaradas; el término de edad se toma como 0 a falta de una
  fecha de creación documentada para esta tarea, ver tutorial/lagunas/07-10.md). Contadores del
  tablero: To Do 54 | In Progress 5 | Done 190, tal y como quedan tras el escenario 5 (que mueve
  TASK-19 de To Do a In Progress) sin que el escenario 6 los toque.
tablero_sale: >
  TASK-19 sigue en In Progress, sin cambios de asignación, de estado ni de arrendamiento. ac 0/2
  sin marcar, sin tocar en este escenario. dod 0/2, con las claves #5 y #6: las claves #1 a #4
  se usaron y se descartaron durante el escenario (#1 se quitó con --rm-dod, #2 a #4 se
  sustituyeron con --set-dod y luego se vaciaron con --clear-dod). Urgencia sin cambios, 11.0.
  Contadores del tablero sin cambios: 54/5/190, porque ningún paso de este escenario mueve una
  tarea de estado.
