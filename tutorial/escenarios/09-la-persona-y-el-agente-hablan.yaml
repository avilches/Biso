id: 09-la-persona-y-el-agente-hablan
titulo: La persona y el agente hablan
situacion: |
  Con la duda del reintento resuelta, sigues implementando TASK-19. Vas dejando constancia de lo
  que compruebas, para que quien lea la tarea después no tenga que releer el diff entero. Pero
  también te llega algo de fuera que no es tuyo: un usuario ha reportado un problema por otro
  canal, y alguien te pide que lo dejes anotado en la tarea. Son dos cosas distintas y es fácil
  confundirlas: una nota de implementación es tu cuaderno, sin firma ni fecha propia por
  entrada; un comentario es una conversación, y siempre lleva quién lo escribió y cuándo.
ensena:
  - >-
    El comando `biso note` añade un párrafo a las notas de implementación. Es un bloque de prosa
    sin autor ni instante por elemento, el cuaderno técnico de quien hace el trabajo.
  - >-
    El comando `biso comment` añade un comentario con autor e instante. Es la vía por la que
    entra lo que viene de fuera, y el canal de conversación con una persona.
  - >-
    El autor por defecto de un comentario es la identidad configurada (`me`). `--comment-author`
    deja firmarlo con otra, texto libre y sin validar, para retransmitir algo que vino de otro
    sistema.
pasos:
  - narracion: |
      Terminas de encajar el reintento con el mismo patrón que ya usaba el endpoint de
      descargas, y dejas constancia de cómo quedó.
    comando: biso note TASK-19 "El backoff exponencial de retry.go se puede reutilizar tal cual; solo hay que fijar el límite a 3."
    salida: |
      TASK-19  In Progress  ac 0/2  dod 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada SPEC 10.7.2, 5.4
  - narracion: |
      Miras cómo ha quedado esa nota.
    comando: biso get TASK-19 --section notes
    salida: |
      TASK-19  Retry the upload on 5xx

      ## Implementation Notes
      El backoff exponencial de retry.go se puede reutilizar tal cual; solo hay que fijar el límite a 3.
    codigo_salida: 0
    origen: derivada SPEC 10.5
    comentario: |
      No hay ningún autor ni ningún instante junto al texto. Las notas no tienen esa estructura:
      son un solo bloque de prosa al que cada `--note` añade un párrafo (8.3), no una lista de
      entradas con autor como los comentarios (5.2). Si necesitaras saber quién escribió una
      nota o cuándo, no lo sabrías: no es ese tipo de dato.
  - narracion: |
      Te llega un aviso: un usuario con conexión móvil ve fallos incluso con el reintento puesto.
      No es algo que hayas visto tú, así que lo entras como comentario, firmado por quien lo
      reportó.
    comando: 'biso comment TASK-19 "Un usuario con conexión móvil ve fallos incluso después de los 3 reintentos, ¿deberíamos subir el límite en ese caso?" --comment-author @trello:juan'
    salida: |
      note: comment #3 by @trello:juan
      TASK-19  In Progress  ac 0/2  dod 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada SPEC 10.7.3, 5.2
    comentario: |
      "note: comment #3 by @trello:juan" sale por stderr, con la forma exacta que da el ejemplo
      de 10.7.3. El número no es una clave estable como la de un criterio (5.1): es la posición
      del comentario en la lista, y como los comentarios nunca se editan ni se borran
      (append-only, 10.7.3), esa posición no vuelve a cambiar. Este es el tercero de TASK-19
      porque `biso answer` ya había añadido dos en el escenario anterior.
  - narracion: |
      Respondes tú, como tú mismo, sin banderas de autor: la identidad configurada firma por
      defecto.
    comando: biso comment TASK-19 "De momento no, 3 reintentos es la política del resto del sistema; si se repite lo revisamos."
    salida: |
      note: comment #4 by @claude
      TASK-19  In Progress  ac 0/2  dod 0/2  urgency 11.0
    codigo_salida: 0
    origen: derivada SPEC 10.7.3, 5.2
    comentario: |
      Sin --comment-author, el autor es `me`, la identidad configurada de este tablero: @claude.
      Es el mismo `--comment-author` que existe en todos los comandos de escritura, no solo en
      `biso comment`: el nombre no cambia porque en `biso comment` parezca redundante (10.6).
  - narracion: |
      Pones las dos secciones una junto a otra para ver el contraste de un vistazo.
    comando: biso get TASK-19 --section notes,comments
    salida: |
      TASK-19  Retry the upload on 5xx

      ## Implementation Notes
      El backoff exponencial de retry.go se puede reutilizar tal cual; solo hay que fijar el límite a 3.

      ## Comments
      @claude, 2026-09-06 14:10
      ¿Cuál es el número máximo de reintentos antes de dar el 5xx por fallo definitivo? ¿Hay ya un valor de referencia en otra parte del código, o hay que fijar uno nuevo?

      @claude, 2026-09-06 15:30
      Ya hay un valor de referencia: el endpoint de descargas usa 3 reintentos con backoff exponencial en retry.go. Usa el mismo valor y la misma lógica aquí.

      @trello:juan, 2026-09-06 16:05
      Un usuario con conexión móvil ve fallos incluso después de los 3 reintentos, ¿deberíamos subir el límite en ese caso?

      @claude, 2026-09-06 16:20
      De momento no, 3 reintentos es la política del resto del sistema; si se repite lo revisamos.
    codigo_salida: 0
    origen: derivada SPEC 10.5, 5.2
    comentario: |
      Las notas son un único bloque; los comentarios son cuatro entradas firmadas, en el orden
      en que se escribieron. `## Implementation Notes` sale antes que `## Comments` aunque en la
      bandera se haya pedido al revés (`notes,comments`): el orden de impresión de las secciones
      es el orden fijo de la ficha completa (10.5), no el orden en que se listan en `--section`.
      La especificación no lo dice de forma explícita para el caso de varias secciones a la vez;
      queda anotado en tutorial/lagunas/07-10.md.
tablero_entra: >
  TASK-19 en In Progress, ac 0/2, dod 0/2, con 2 comentarios (la pregunta y la respuesta del
  escenario 8) y sin notas todavía. Urgencia 11.0. Contadores del tablero: 54/5/190, sin cambios
  desde el escenario 8.
tablero_sale: >
  TASK-19 sigue en In Progress, ac 0/2 y dod 0/2 sin tocar. Tiene ya 1 párrafo de notas de
  implementación y 4 comentarios en total: los 2 de la pregunta y la respuesta del escenario 8,
  más el de @trello:juan y la respuesta de @claude de este escenario. Urgencia sin cambios,
  11.0. Contadores del tablero sin cambios: 54/5/190.
