site_name: biso
site_description: Especificacion y decisiones de diseno de biso, el CLI de gestion de tareas
docs_dir: docs

# docs/superpowers/ guarda los documentos de diseno y los planes de las sesiones de
# brainstorming. Se publican, porque ESTADO-DEL-ARTE.md enlaza a uno de ellos, pero no
# entran en el menu lateral para no mezclarlos con los cuatro documentos principales.
not_in_nav: |
  superpowers/

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - content.code.copy
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: es

# Un enlace a un fichero que no existe o a un ancla que no existe pasa a ser un aviso, y con
# --strict, un fallo de build. Es lo que sostiene la convencion de citar por el titulo de la
# seccion en vez de por su numero: una referencia rota deja de ser un error silencioso.
validation:
  anchors: warn
  unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Sin esto, el titulo "Codigos de salida" genera el ancla "codigos-de-salida", sin los
      # acentos, y un enlace que los lleve falla. Con el slugify de pymdownx las anclas
      # conservan los acentos, quedan legibles y coinciden con las que genera GitHub, asi que
      # un enlace funciona igual en el sitio y leyendo el fichero en crudo.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Especificacion: SPEC.md
  - Decisiones de diseno: DECISIONES.md
  - Estado del arte: ESTADO-DEL-ARTE.md
  - Pendientes: PENDIENTES.md
